services:
  postgres:
    image: postgres:16-alpine
    container_name: data-dyna-postgres-test
    environment:
      POSTGRES_DB: ${DATA_DYNA_TEST_DB_NAME:-data_dyna_test}
      POSTGRES_USER: ${DATA_DYNA_TEST_DB_USER:-data_dyna}
      POSTGRES_PASSWORD: ${DATA_DYNA_TEST_DB_PASSWORD:-data_dyna_local_password}
    ports:
      - "${DATA_DYNA_TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - data-dyna-postgres-test-data:/var/lib/postgresql/data

volumes:
  data-dyna-postgres-test-data:
