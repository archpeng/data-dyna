name: DB Migration Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  db-migration-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: data_dyna_test
          POSTGRES_USER: data_dyna
          POSTGRES_PASSWORD: data_dyna_local_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U data_dyna -d data_dyna_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATA_DYNA_TEST_DATABASE_URL: postgresql://data_dyna:data_dyna_local_password@localhost:55432/data_dyna_test
      DATA_DYNA_TEST_DB_NAME: data_dyna_test
      DATA_DYNA_TEST_DB_USER: data_dyna
      DATA_DYNA_TEST_DB_PASSWORD: data_dyna_local_password
      DATA_DYNA_TEST_DB_HOST: localhost
      DATA_DYNA_TEST_DB_PORT: "55432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Whitespace check
        run: git diff --check

      - name: Static schema migration safety check
        run: npm run check:schema-migrations

      - name: PostgreSQL migration integration gate
        run: npm run test:db:migrations

      - name: Unit and contract tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck
